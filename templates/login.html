<!DOCTYPE html>
<html>
<head>
    <title>CRG Meridian — Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,.1);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        h2 { margin-bottom: 8px; color: #1a73e8; }
        p  { color: #666; margin-bottom: 24px; }
        input[type=password] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            margin-bottom: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
        }
        button:hover { background: #1557b0; }
        .error {
            color: red;
            margin-bottom: 12px;
            font-size: .9em;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>🍽️ CRG Meridian</h2>
    <p>Review Automation Dashboard</p>
    {% for msg in get_flashed_messages() %}
    <div class="error">{{ msg }}</div>
    {% endfor %}
    <form method="POST">
        <input type="password" name="password" placeholder="Enter password" autofocus>
        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
